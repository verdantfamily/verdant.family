# How the indexer is deployed, in the repository rather than in a dashboard.
#
# The indexer is the one part of Verdant that cannot be static or serverless: it holds a
# database, follows the chain continuously and answers questions about what it has seen.
# Vercel hosts the site; this hosts the feed the site reads.
#
# The whole monorepo is the build context, not `apps/indexer`, because the indexer imports
# three workspace packages and each resolves to a `dist` that has to be compiled first.
# `^...` is pnpm for "the dependencies of this package, not the package itself", which is
# what keeps a Next build for the web app out of a deploy that has nothing to do with it.
#
# Nothing here configures the chain, the factory or the block to start from. Those come
# from the deployment record in `packages/config`, so a deploy of this cannot disagree with
# a deploy of the site about which Verdant it is following. The only variables that matter
# are the ones Railway sets itself: `DATABASE_URL`, which is how Ponder knows to use
# Postgres rather than a local PGlite file, and `PORT`.

[build]
builder = "NIXPACKS"
buildCommand = "pnpm --filter \"@verdant/indexer^...\" build"

[deploy]
# Through `exec` rather than the package's own `start` script, so that the flags reach
# Ponder instead of being read by pnpm.
#
# A schema per deployment, which is Ponder's own recommendation for this platform and not a
# workaround. Ponder identifies an app by a hash of its configuration and code, and refuses
# to write into a schema some other version of the app wrote — correctly, since mixing two
# schedules of what to index in one set of tables produces data that answers to neither. A
# fixed name therefore turns every change to this indexer into "drop the database first",
# and a deploy that is waiting for a human to remember that is a deploy that hangs.
#
# What it costs: each deployment re-indexes from `VERDANT_START_BLOCK`. That part is cheap —
# the start block is a few thousand blocks back, and the cached RPC results live in
# `ponder_sync`, which is shared, so a redeploy re-reads the chain from a local cache rather
# than from the network.
#
# What was not cheap, and took the indexer down: the schemas left behind. Every deployment
# wrote a fresh full copy of the indexed chain and none of them were ever dropped, so the
# volume filled — 4.7 GB of 5 GB — and Postgres began refusing connections. The symptom was
# not "the disk is full" but `RetryableError: Failed to connect to database` in a crash loop,
# and a feed answering 502 to everything.
#
# `ponder db prune` drops the tables and schemas of deployments that are no longer active,
# which is every previous one: `overlapSeconds = 0` below means the old container is already
# gone before this runs. It is chained ahead of `start` rather than run by hand so that the
# cleanup cannot be the step somebody forgets — the failure it prevents arrives weeks later
# and looks like a database problem rather than a deployment one.
#
# `||` and not `&&`, which is the whole point of this line. Chained with `&&`, a prune that
# could not run stopped `start` from running at all, and the way prune fails is by being
# unable to reach the database — which is exactly the state a full disk produces. So the
# cleanup meant to prevent an outage became the thing that guaranteed one: Postgres refused
# connections, prune exited non-zero, the feed never started, and every request answered 502.
#
# Housekeeping must never be load-bearing for serving traffic. An indexer that starts with
# stale schemas still answers questions; one that refuses to start answers nothing.
#
# Three services now deploy from this repository, and Railway applies the root config to
# every one of them: there is no per-service block, and a service only reads a different
# file if somebody sets its config path in the dashboard. So the first deploy of the Agen
# app dutifully ran `ponder db prune`, failed a health check on a path it does not serve,
# and rolled back. Branching on the service name keeps all three correct in one file, which
# is uglier than three files and is the only version that works without a manual step
# nobody will remember. If Agen ever gets its own config path set, this collapses back.
#
# The third is `instant-indexer`, which is a second Ponder app against a second Postgres.
# It needs no change to the build command above: `@verdant/indexer^...` and
# `@verdant/instant-indexer^...` resolve to the same three workspace packages, so the
# artifacts either one needs are already built.
startCommand = "bash scripts/railway-start.sh"

# Both services answer `/health` — the indexer natively, the Agen app through a route
# added for exactly this reason, because the path is shared whether or not the services
# are.
#
# `/health` answers as soon as the server is listening; `/ready` waits for the backfill.
# The first deploy has a third of a million blocks to read, and a health check that waited
# for that would call a working indexer a failed one and roll it back.
healthcheckPath = "/health"
healthcheckTimeout = 300

# The old container goes away before the new one starts, rather than the two overlapping.
# Ponder takes a lock on its schema and a second instance waits for it, so an overlap is a
# deadlock rather than a graceful handover: the new process waits for a lock the old one
# holds, the health check waits for the new process, and nothing moves until one is killed.
overlapSeconds = 0

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

