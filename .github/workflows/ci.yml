name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never write to a chain from CI. Nothing here needs a key, and a workflow that
  # cannot sign cannot accidentally deploy.
  FOUNDRY_PROFILE: default

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version pin here on purpose: the version lives in the `packageManager`
      # field of package.json, and specifying it in both places is an error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm build

      - name: typecheck
        run: pnpm typecheck

      - name: test
        run: pnpm test

      # models/ is generated from packages/config/src/launch-models.ts, so this
      # asserts that the published model library is the one the interface
      # renders. It also resolves every evidence path those manifests cite, which
      # makes a renamed test a build failure rather than a dead link in the
      # public record.
      - name: published model library matches the interface
        run: pnpm verify:models

      # A link to a renamed test reads like evidence and is not.
      - name: documentation links resolve
        run: pnpm verify:docs

      # Last rather than first, deliberately: a type error or a failing test is a more
      # useful thing to be told about than a lint finding, and a job that stops at its
      # first failure should stop at the most informative one.
      - name: lint
        run: pnpm lint

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1

      # Invoked directly rather than through pnpm so this job needs no Node
      # toolchain at all.
      - name: vendor pinned dependencies
        run: bash scripts/vendor-contracts-deps.sh

      - name: forge build
        working-directory: packages/contracts
        run: forge build

      # Scoped to src/, because `--sizes` alone measures the vendored Uniswap
      # tree too and fails on contracts we do not deploy.
      - name: contract sizes within EIP-170
        run: bash scripts/check-sizes.sh

      - name: forge fmt
        working-directory: packages/contracts
        run: forge fmt --check

      - name: forge test
        working-directory: packages/contracts
        run: forge test -vvv

      # The gas snapshot is committed. A change to it is a change to the cost of
      # using the protocol, so it must appear in a diff and be argued for, not
      # discovered after a deployment.
      #
      # Scoped to the gas suite deliberately. A whole-project snapshot would
      # include fuzz averages, which move with the fuzzer's seed, and the vector
      # suites, whose cost is dominated by JSON parsing — both would make this
      # check fail for reasons that have nothing to do with protocol cost.
      - name: gas snapshot unchanged
        working-directory: packages/contracts
        run: forge snapshot --check --match-contract "GasTest"

  # Read-only, and allowed to fail without failing the build: this job asserts
  # facts about somebody else's chain, so a red X here means "the chain changed
  # or the RPC is down", which is information rather than a broken commit.
  chain-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: probe both chains
        run: node scripts/probe.ts
