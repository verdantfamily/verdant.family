version: 2

updates:
  # Solidity dependencies are deliberately absent from this file. They are pinned
  # by scripts/vendor-contracts-deps.sh to the exact commits matching bytecode
  # already deployed on 4663, established by a byte-for-byte source diff. An
  # automated bump to upstream main would silently break that correspondence, so
  # those moves are made by hand with a diff to argue about.

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One pull request per group rather than per package. Fifteen separate
      # bumps is fifteen CI runs and one review nobody does carefully.
      #
      # Development dependencies are grouped including majors. A major bump of a
      # linter or a test runner either builds or does not, and CI answers that in
      # one run — whereas four separate major PRs is four runs answering the same
      # question about the same lockfile.
      development:
        dependency-type: development
        update-types: [major, minor, patch]

      # Runtime dependencies are grouped only up to minor. A major here can change
      # behaviour that reaches a transaction, and that is worth its own pull
      # request and its own argument rather than a line in a batch.
      production:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
